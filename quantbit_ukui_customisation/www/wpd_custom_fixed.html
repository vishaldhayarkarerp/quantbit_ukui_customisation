<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="Description" content="WebPlotDigitizer v5.3 - Web based tool to extract numerical data from plots and graph images." />
    <meta name="Keywords" content="Plot, Digitizer, WebPlotDigitizer, Ankit Rohatgi, Extract Data, Convert Plots, XY, Polar, Ternary, Map, HTML5" />
    <meta name="Author" content="Ankit Rohatgi" />
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <title>WebPlotDigitizer - Copyright 2010-2025 Ankit Rohatgi</title>
    <link rel="stylesheet" href="/WebPlotDigitizer/node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/WebPlotDigitizer/styles/styles.css" type="text/css" media="screen" />
    <link rel="stylesheet" href="/WebPlotDigitizer/styles/widgets.css" type="text/css" media="screen" />
    <link rel="stylesheet" href="/WebPlotDigitizer/styles/constants.css" type="text/css" media="screen" />
    <link rel="shortcut icon" href="/WebPlotDigitizer/favicon.ico" type="image/x-icon" />

    <!-- thirdparty -->
    <script type="module" src="/WebPlotDigitizer/node_modules/pdfjs-dist/build/pdf.min.mjs"></script>
    <script src="/WebPlotDigitizer/node_modules/tarballjs/tarball.js"></script>
    <script src="/WebPlotDigitizer/wpd.min.js"></script>
</head>

<body>

    <div id="loadingCurtain" style="position: absolute; top: 0px; left: 0px; z-index: 100; width: 100%; height: 100%; background-color: white;">
        Loading application, please wait...
        <br />
        <br />
        Problems loading? Make sure you have a recent version of Google Chrome, Firefox, Safari or Microsoft Edge installed.
    </div>

    <div id="wpd-tooltip"></div>

    <div id="allContainer">
        <!-- toolbar + graphics -->
        <div id="mainContainer">
            <div id="topContainer">
                <div class="hidden" style="display: none; width: 170px; text-align: center; padding-top: 9px;">
                    <img src="/WebPlotDigitizer/images/icon/icon.svg" width="18" height="18" style="vertical-align: middle;" />
                    <a href="https://automeris.io" target="_blank"  style="text-decoration: none; color: black; vertical-align: middle;">automeris.io</a>
                </div>
                <div id="menuButtonsContainer">
                </div>

                <div id="topToolbarContainer">
                    <div style="position:relative;">
                    </div>
                </div>

                <div style="display: inline-block; width: 220px; text-align: right; padding-top: 9px;">
                    <button type="button" onclick="wpd.graphicsWidget.rotateCounterClockwise();" class="toolbar-button has-tooltip" data-tooltip="Rotate 90° counter-clockwise">
                        <i class="bi bi-arrow-counterclockwise"></i>
                    </button>
                    <button type="button" onclick="wpd.graphicsWidget.rotateClockwise();" class="toolbar-button has-tooltip" data-tooltip="Rotate 90° clockwise">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                    <button type="button" onclick="wpd.graphicsWidget.zoomIn();" class="toolbar-button has-tooltip" data-tooltip="Zoom In">+</button>
                    <button type="button" onclick="wpd.graphicsWidget.zoomOut();" class="toolbar-button has-tooltip" data-tooltip="Zoom Out">-</button>
                    <button type="button" onclick="wpd.graphicsWidget.zoom100perc();" class="toolbar-button has-tooltip" data-tooltip="View actual size">100%</button>
                    <button type="button" onclick="wpd.graphicsWidget.zoomFit();" class="toolbar-button has-tooltip" data-tooltip="Fit image to screen">Fit</button>
                    <button onclick="wpd.graphicsWidget.toggleExtendedCrosshairBtn();" class="toolbar-button has-tooltip" style="background-image: url('/WebPlotDigitizer/images/crosshair.png'); background-repeat: no-repeat; background-position: center;" id="extended-crosshair-btn" data-tooltip="Toggle extended crosshair">&nbsp;</button>
                </div>

            </div>

            <div style="display: flex;">
                <div id="left-side-container" style="width:200px; flex: 0 0 169px;">
                    <!-- tree control -->
                    <!-- Tree will be loaded by wpd.min.js -->
                </div>

                <div id="graphicsContainer" style="flex: 1;">
                    <!-- the main canvas goes here -->
                    <div id="canvasDiv" style="position:relative;">
                        <canvas id="mainCanvas" class="canvasLayers" style="z-index:1;"></canvas>
                        <canvas id="dataCanvas" class="canvasLayers" style="z-index:2;"></canvas>
                        <canvas id="drawCanvas" class="canvasLayers" style="z-index:3;"></canvas>
                        <canvas id="hoverCanvas" class="canvasLayers" style="z-index:4;"></canvas>
                        <canvas id="topCanvas" class="canvasLayers" style="z-index:5;"></canvas>
                    </div>
                </div>
            </div>

            <div id="bottomContainer">
                <div id="bottomNavbarContainer">
                    <!-- Navbar will be loaded by wpd.min.js -->
                </div>
            </div>
        </div>

        <!-- sidebar + zoom -->
        <div id="sidebarContainer">
            <!-- zoom window goes here -->
            <div style="position:relative;" id="zoomDiv">
                <canvas id="zoomCanvas" class="zoomLayers" width=250 height=250 style="position:relative; top: 0px; left: 0px; z-index:1;"></canvas>
                <canvas id="zoomCrossHair" class="zoomLayers" width=250 height=250 style="position:absolute; top: 0px; left: 0px; z-index:2; background:transparent;"></canvas>
                <div id="cursorPosition" style="position:relative;">
                    [<span id="mousePosition"></span>]
                </div>
            </div>

            <div id="zoom-settings-container">
                <button id="zoom-settings-button" class="has-tooltip" onclick="wpd.zoomView.showSettingsWindow();" data-tooltip="Change zoom settings">
                    <i class="bi bi-gear-fill"></i>
                </button>
            </div>

            <div style="position:relative;" id="sidebarControlsContainer">
                <!-- side bars go here -->
                <!-- Sidebars will be loaded by wpd.min.js -->
            </div>

        </div>
    </div>

    <!-- popup windows go here -->
    <!-- Popups will be loaded by wpd.min.js -->

    <script>
        console.log('wpd_custom_fixed.html: Script loaded');
        
        // Message listener to handle image loading from parent window
        window.addEventListener('message', function(event) {
            console.log('wpd_custom_fixed.html: Message received:', event.data);
            
            if (event.data && event.data.action === 'loadImage') {
                const fileData = event.data;
                console.log('wpd_custom_fixed.html: Loading image:', fileData.name);
                
                // Create a File object from the ArrayBuffer
                const blob = new Blob([fileData.arrayBuffer], { type: fileData.type });
                const file = new File([blob], fileData.name, { type: fileData.type });
                
                // Initialize WebPlotDigitizer with the file
                if (typeof wpd !== 'undefined' && wpd.imageManager) {
                    console.log('wpd_custom_fixed.html: Initializing with file');
                    wpd.imageManager.initializeFileManager([file], true);
                    wpd.imageManager.loadFromFile(file).then(() => {
                        console.log('wpd_custom_fixed.html: Image loaded successfully');
                        wpd.busyNote.close();
                        if (!wpd.browserInfo.isElectronBrowser()) {
                            // Auto-open calibration dialog
                            setTimeout(() => {
                                wpd.calibrateAxesDialog.open();
                                console.log('wpd_custom_fixed.html: Calibration dialog opened');
                            }, 500);
                        }
                    }).catch(error => {
                        console.error('wpd_custom_fixed.html: Error loading image:', error);
                    });
                } else {
                    console.error('wpd_custom_fixed.html: WebPlotDigitizer not initialized');
                }
            }
        });
        
        // Initialize WebPlotDigitizer when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('wpd_custom_fixed.html: DOMContentLoaded fired.');
            console.log('wpd_custom_fixed.html: Checking wpd object...', typeof wpd);
            
            if (typeof wpd !== 'undefined') {
                console.log('wpd_custom_fixed.html: wpd object is defined.');
                console.log('wpd_custom_fixed.html: wpd methods:', Object.keys(wpd));
                
                if (typeof wpd.initApp === 'function') {
                    wpd.initApp();
                    console.log('wpd_custom_fixed.html: wpd.initApp() called');
                } else {
                    console.error('wpd_custom_fixed.html: wpd.initApp is not a function');
                }
                
                // Override the popup.show function to intercept the calibration dialog
                if (wpd.popup && typeof wpd.popup.show === 'function') {
                    const originalPopupShow = wpd.popup.show;
                    wpd.popup.show = function(dialogId) {
                        console.log(`wpd_custom_fixed.html: wpd.popup.show called with dialogId: ${dialogId}`);
                        if (dialogId === 'calibrate-axes-options') {
                            console.log('wpd_custom_fixed.html: Auto-selecting 2D XY Axes and calibrating...');
                            
                            // Small delay to ensure the dialog is rendered
                            setTimeout(() => {
                                // Select 2D XY Axes (first item) and calibrate
                                const xyAxesOption = document.getElementById('calibrate-axes-option-xy');
                                if (xyAxesOption) {
                                    console.log('wpd_custom_fixed.html: Found calibrate-axes-option-xy element.');
                                    // Trigger selection
                                    xyAxesOption.click();
                                    console.log('wpd_custom_fixed.html: 2D XY Axes selected');
                                    
                                    // Small delay then calibrate
                                    setTimeout(() => {
                                        wpd.calibrateAxesDialog.calibrate();
                                        console.log('wpd_custom_fixed.html: Calibration triggered - ready for point selection');
                                    }, 100);
                                } else {
                                    console.error('wpd_custom_fixed.html: Could not find calibrate-axes-option-xy element.');
                                }
                            }, 100);
                        }
                        return originalPopupShow.call(this, dialogId);
                    };
                } else {
                    console.error('wpd_custom_fixed.html: wpd.popup.show is not available');
                }
            } else {
                console.error('wpd_custom_fixed.html: WebPlotDigitizer not loaded (wpd is undefined).');
            }
        });
    </script>

</body>

</html>
