<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Attachments Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="uk.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
</head>

<body class="bg-gray-900 text-white min-h-screen font-inter p-4">
    <div class="container mx-auto max-w-4xl">
        <div class="bg-pink-600 p-6 rounded-t-xl shadow-lg flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">Attachments: <span id="recordDisplay">Loading...</span></h1>
            <a href="javascript:history.back()"
                class="bg-pink-800 hover:bg-pink-900 px-4 py-2 rounded-lg text-sm transition">Back</a>
        </div>

        <div class="bg-gray-800 p-6 rounded-b-xl shadow-lg">
            <div class="bg-gray-700 p-6 rounded-lg space-y-6">
                <p class="text-gray-300">Manage your medical images and use the digitizer to extract data points
                    directly into this record.</p>

                <div class="flex flex-wrap gap-4">
                    <label for="file-upload"
                        class="bg-pink-600 hover:bg-pink-700 px-6 py-2 rounded-lg font-bold cursor-pointer transition">
                        Attach Files
                    </label>
                    <input id="file-upload" type="file" name="file" accept="*/*" multiple style="display:none;">

                    <button id="get-data-points-btn"
                        class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-bold transition">
                        Get Data Points
                    </button>
                </div>

                <div id="fileList" class="w-full">
                    <div class="text-gray-500 italic">No files currently attached.</div>
                </div>
            </div>
        </div>

        <iframe id="wpd-iframe" src="/WebPlotDigitizer/dist/offline.html"
            style="display:none;width:100vw;height:90vh;border:none;margin-top:20px;z-index:1100;position:fixed;top:20px;left:0;background:transparent;"></iframe>
    </div>

    <!-- Photo Cropper Modal -->
    <div id="cropperModal" class="fixed inset-0 bg-black bg-opacity-75 z-50 hidden flex items-center justify-center">
        <div class="bg-gray-800 rounded-lg p-6 max-w-4xl max-h-[90vh] overflow-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-white">Crop Image</h3>
                <button onclick="closeCropperModal()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>
            <div class="mb-4">
                <img id="cropperImage" style="max-width: 100%; display: block;">
            </div>
            <div class="mb-4">
                <label for="croppedFileName" class="block text-sm font-medium text-gray-300 mb-2">
                    Filename (optional):
                </label>
                <input type="text" id="croppedFileName" placeholder="Leave empty to use original filename"
                    class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent">
                <p class="text-xs text-gray-400 mt-1">Leave empty to keep original filename, or enter a custom name</p>
            </div>
            <div class="flex justify-end gap-3">
                <button onclick="closeCropperModal()"
                    class="px-4 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-lg transition">
                    Cancel
                </button>
                <button onclick="cropAndSaveImage()"
                    class="px-4 py-2 bg-pink-600 hover:bg-pink-700 text-white rounded-lg transition">
                    Crop & Save
                </button>
            </div>
        </div>
    </div>

    <script src="medical_attachments.js"></script>
</body>

</html>
